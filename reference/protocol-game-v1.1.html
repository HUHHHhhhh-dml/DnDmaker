<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Companion App - Imperium Edition</title>
    <style>
        /* ================= PALETA Y CONFIGURACIÓN BASE ================= */
        :root {
            --bg-color: #ffffff;
            --btn-gray: #d3d3d3;
            --coin-orange: #ffa500;
            --coin-gray: #808080;
            --hp-red: #8b0000;
            --util-blue: #a0c4ff;
            --special-gold: #ffd700;
            --text-dark: #333;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-container {
            width: 800px;
            height: 600px;
            background-color: var(--bg-color);
            border: 4px solid black;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            box-sizing: border-box;
            padding: 20px;
        }
        .screen.active { display: flex; opacity: 1; }

        /* ================= BOTONES Y FORMAS GEOMÉTRICAS ================= */
        .menu-btn {
            background-color: var(--btn-gray);
            border: 2px solid black;
            padding: 12px 35px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 4px 4px 0px black;
            clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 10% 100%, 0 80%);
        }
        .menu-btn:hover { background-color: #bbb; }

        .pentagon {
            width: 65px; height: 65px;
            background-color: var(--btn-gray);
            border: 2px solid black;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 11px;
            background-size: cover; background-position: center; text-align: center;
        }
        .pentagon:hover { background-color: #bbb; }

        .utility-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .utility-combat-icon {
            width: 65px; height: 65px;
            background-color: var(--btn-gray);
            border: 2px solid black; border-radius: 50%;
            position: relative; display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 10px; text-align: center;
            background-size: cover; background-position: center;
        }
        .utility-combat-icon::after {
            content: ''; position: absolute;
            top: -2px; right: -2px; bottom: -2px; left: -2px;
            border: 4px solid transparent; border-right: 4px solid var(--util-blue);
            border-radius: 50%; pointer-events: none;
        }

        /* Dominios y Habitat (Formas Secretas) */
        .special-btn {
            width: 65px; height: 65px;
            background-color: var(--special-gold);
            border: 2px solid black;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 10px;
            background-size: cover; background-position: center; text-align: center;
            box-shadow: 0 0 10px var(--special-gold);
        }

        .def-badge, .atk-badge {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-weight: bold; font-size: 13px; border: 2px solid black;
        }
        .def-badge { width: 60px; height: 65px; background-color: var(--util-blue); clip-path: polygon(0% 0%, 100% 0%, 100% 65%, 50% 100%, 0% 65%); }
        .atk-badge { width: 75px; height: 45px; background-color: black; color: white; clip-path: polygon(20% 0%, 80% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%); }

        .coins-container { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
        .coin { width: 12px; height: 12px; border-radius: 50%; background-color: var(--coin-orange); border: 1px solid black; }
        .coin.tails { background-color: var(--coin-gray); }
        .flip-anim { animation: flip 0.5s ease-in-out; }
        @keyframes flip { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }

        .info-box { border: 2px solid black; padding: 8px; background: white; text-align: center; font-weight: bold; font-size: 13px; box-shadow: 2px 2px 0px black; }
        .btn-small { border: 2px solid black; background: white; padding: 4px 10px; cursor: pointer; font-weight: bold; }

        /* ================= SISTEMA DE CAPAS INDEPENDIENTES (PERSONAJE DINÁMICO) ================= */
        .character-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .start-btn { background-color: white; border: 2px solid black; padding: 8px 30px; font-size: 20px; font-weight: bold; cursor: pointer; margin-bottom: 15px; box-shadow: 3px 3px 0px black; border-radius: 4px; }
        
        .char-box { width: 200px; height: 300px; position: relative; }
        .char-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        .hp-semi-container { width: 206px; height: 40px; background-color: white; border: 3px solid black; border-top: none; border-radius: 0 0 120px 120px; position: relative; overflow: hidden; }
        .hp-semi-fill { width: 100%; height: 100%; background-color: var(--hp-red); transition: width 0.3s ease; }
        .hp-text { position: absolute; top: 8px; left: 0; width: 100%; text-align: center; color: black; font-weight: bold; font-size: 16px; z-index: 10; }

        /* ================= LAYOUTS ================= */
        .combat-layout { display: grid; grid-template-columns: 1fr 1.5fr 1fr; width: 100%; height: 100%; }
        .col-left { display: flex; flex-direction: column; gap: 15px; justify-content: center; align-items: flex-start; }
        .col-right { display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: flex-end; }

        .inv-layout { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr 1fr; width: 100%; height: 100%; align-items: center; }
        .inv-slot-box {
            width: 75px; height: 75px; border: 2px solid black; background: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 11px; text-align: center;
            box-shadow: 2px 2px 0px black; background-size: cover; background-position: center;
        }
        .inv-slot-box span { font-size: 9px; color: #333; font-weight: bold; margin-top: 3px; background: rgba(255,255,255,0.7); padding: 1px 3px; border-radius: 3px; }
        .inv-col-skills { grid-column: 1 / span 5; display: flex; justify-content: center; gap: 30px; margin-top: 20px; }

        /* Modales */
        .modal { display: none; position: absolute; top: 12%; left: 12%; width: 76%; height: 76%; background: rgba(0,0,0,0.95); color: white; z-index: 100; padding: 25px; box-sizing: border-box; border: 4px solid var(--btn-gray); }
    </style>
</head>
<body>

<div id="game-container">
    
    <div id="main-menu" class="screen active" style="flex-direction: column; justify-content: center; padding-left:100px;">
        <div style="font-size: 64px; font-weight: bold; margin-bottom: 50px; text-shadow: 2px 2px white;">PROTOCOL LIFE</div>
        <button class="menu-btn" onclick="changeScreen('combat-menu')">PLAY</button>
        <button class="menu-btn" onclick="openSettings()">Settings</button>
        <button class="menu-btn" onclick="alert('Juego cerrado')">Quit</button>
    </div>

    
    <div id="combat-menu" class="screen">
        <div class="combat-layout">
            <div class="col-left">
                <div id="combat-skills-list" style="display:flex; flex-direction:column; gap:10px;"></div>
                    <div id="d20-container" style="display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; background: #333; padding: 10px; border-radius: 8px; color: white;">
                        <div id="d20-dice" onclick="rollD20()" style="width: 45px; height: 45px; background: #8b0000; border: 2px solid #ffd700; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s;">20</div>
                        <span style="font-size: 14px; font-family: monospace;">Resultado d20: <strong id="d20-result" style="color: #ffd700; font-size: 18px;">-</strong></span>
                    </div>
                <div style="display:flex; gap:15px;">
                    <div class="utility-wrapper" onclick="useUtility()">
                        <div class="utility-combat-icon" id="combat-util-icon">Utilidad</div>
                        <div id="util-uses-text" style="font-weight:bold; font-size:13px;">3/3</div>
                    </div>
                    
                    <div id="combat-secret-section" style="display:none; gap:10px;">
                        <div class="utility-wrapper" onclick="activateDomain()">
                            <div class="special-btn" id="combat-domain-icon" style="background-color:#9370DB;">Dominio</div>
                            <div style="font-weight:bold; font-size:10px; color:#9370DB;">DOM</div>
                        </div>
                        <div class="utility-wrapper" onclick="activateHabitat()">
                            <div class="special-btn" id="combat-habitat-icon">Habitat</div>
                            <div style="font-weight:bold; font-size:10px; color:var(--special-gold);">HAB</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="character-zone">
                <div id="active-buff-indicator" style="color:var(--special-gold); font-weight:bold; margin-bottom:5px; height:15px;"></div>
                <button class="start-btn" onclick="restoreHP()">Start!</button>
                <div class="char-box" id="combat-char-box"></div>
                <div class="hp-semi-container">
                    <div class="hp-semi-fill" id="hp-fill"></div>
                    <div class="hp-text"><span id="current-hp">50</span>/<span id="max-hp">50</span></div>
                </div>
            </div>

            <div class="col-right">
                <button class="menu-btn" style="width:130px; font-size:16px; padding:8px;" onclick="changeScreen('inventory-menu')">Inventario</button>
                <div class="info-box" style="width: 100px;">Damage Dealt<br><span id="dmg-dealt" style="font-size:20px;">&</span></div>
                <div class="info-box" style="width: 100px;">
                    Damage Taken<br>
                    <div style="display:flex; justify-content:center; gap:4px; margin-top:4px;">
                        <input type="number" id="dmg-input" style="width:40px; text-align:center;" value="0">
                        <button class="btn-small" style="padding:1px 6px;" onclick="applyDamage()">></button>
                    </div>
                </div>
                <div class="def-badge">DEF<br><span id="total-def" style="font-size:16px;">0</span></div>
                <button class="btn-small" onclick="openSettings()">Settings</button>
                <button class="btn-small" onclick="changeScreen('main-menu')">Save & Quit</button>
            </div>
        </div>
    </div>

    <div id="inventory-menu" class="screen">
        <div class="inv-layout">
            <div style="display:flex; flex-direction:column; gap:60px; align-items:center;">
                <div class="utility-wrapper" onclick="openEquipModal('utility')">
                    <div class="inv-slot-box" style="border-radius:50%;" id="slot-utility">Utilidad<br><span id="slot-utility-name">Ninguno</span></div>
                </div>
                <div class="atk-badge">ATK<br><span id="total-atk">0</span></div>
            </div>

            <div style="display:flex; flex-direction:column; gap:50px; align-items:center;">
                <div class="inv-slot-box" id="slot-horns" onclick="openEquipModal('horns')">Horns<br><span id="slot-horns-name">Ninguno</span></div>
                <div class="inv-slot-box" id="slot-hand" onclick="openEquipModal('hand')">Hand<br><span id="slot-hand-name">Ninguno</span></div>
            </div>

            <div class="character-zone">
                <button class="menu-btn" style="width:160px; padding:8px; font-size:16px; margin-bottom:10px;" onclick="changeScreen('combat-menu')">Save & Fight!</button>
                <div class="char-box" id="inv-char-box" style="height:260px;"></div>
                <div class="hp-semi-container">
                    <div class="hp-semi-fill" id="inv-hp-fill"></div>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:50px; align-items:center;">
                <div class="inv-slot-box" id="slot-armor" onclick="openEquipModal('armor')">Armor<br><span id="slot-armor-name">Ninguno</span></div>
                <div class="inv-slot-box" id="slot-leg" onclick="openEquipModal('leg')">Leg<br><span id="slot-leg-name">Ninguno</span></div>
            </div>

            <div style="display:flex; flex-direction:column; gap:40px; align-items:center;">
                <div class="info-box" style="background:#ffa500; width:100px; font-size:11px; padding:5px;">
                    CODE HERE<br>
                    <input type="text" id="decode-input" style="width:65px; margin-top:2px; text-align:center;">
                    <button onclick="decodeItem()" style="margin-top:3px; font-size:10px; font-weight:bold; cursor:pointer;">DECODE</button>
                    <div id="decode-indicator" style="width:10px; height:10px; border-radius:50%; background:gray; display:inline-block; margin-left:3px; vertical-align:middle;"></div>
                </div>
                <div class="def-badge">DEF<br><span id="inv-total-def">0</span></div>
            </div>

            <div class="inv-col-skills">
                <div style="text-align:center;"><div class="pentagon" id="slot-skill1" onclick="openEquipModal('skill1')">1</div><div id="slot-skill1-name" style="font-size:10px; font-weight:bold; margin-top:3px;">Vacío</div></div>
                <div style="text-align:center;"><div class="pentagon" id="slot-skill2" onclick="openEquipModal('skill2')">2</div><div id="slot-skill2-name" style="font-size:10px; font-weight:bold; margin-top:3px;">Vacío</div></div>
                <div style="text-align:center;"><div class="pentagon" id="slot-skill3" onclick="openEquipModal('skill3')">3</div><div id="slot-skill3-name" style="font-size:10px; font-weight:bold; margin-top:3px;">Vacío</div></div>
                
                <div id="inv-secret-section" style="display:none; gap:30px;">
                    <div style="text-align:center;"><div class="special-btn" id="slot-domain" style="background-color:#9370DB;" onclick="openEquipModal('domain')">DOM</div><div id="slot-domain-name" style="font-size:10px; font-weight:bold; margin-top:3px;">Vacío</div></div>
                    <div style="text-align:center;"><div class="special-btn" id="slot-habitat" onclick="openEquipModal('habitat')">HAB</div><div id="slot-habitat-name" style="font-size:10px; font-weight:bold; margin-top:3px;">Vacío</div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="equip-modal" class="modal">
        <h3 id="modal-title" style="margin-top:0;">Seleccionar Objeto</h3>
        <div id="modal-items-list" style="display:flex; gap:12px; flex-wrap:wrap; max-height:240px; overflow-y:auto; padding:5px;"></div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn-small" style="background:#ffcccc; border-color:red; color:black;" onclick="equipItem(null)">Desequipar Slot</button>
            <button class="btn-small" onclick="closeEquipModal()">Cancelar</button>
        </div>
    </div>

    <div id="settings-modal" class="modal"><h2>Settings</h2><button class="btn-small" onclick="closeSettings()">Cerrar</button></div>
</div>

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.style.display = 'none'; });
        const nextScreen = document.getElementById(screenId);
        nextScreen.style.display = 'flex';
        setTimeout(() => nextScreen.classList.add('active'), 50);
        updateUI();
    }

    function renderCharacterLayers() {
    let layersHtml = `<img src="${CHARACTER_IMAGE_PATH}" class="char-layer" onerror="this.style.display='none'">`;
    const layersOrder = ['leg', 'armor', 'horns', 'hand'];
    layersOrder.forEach(slot => {
        const code = gameState.equipped[slot];
        
        // CORRECCIÓN: Si hay un aspecto de skill activo en la mano, se queda fijo
        if (slot === 'hand' && skillWeaponOverride) {
            layersHtml += `<img src="${skillWeaponOverride}" class="char-layer" onerror="this.style.display='none';">`;
        } 
        // Si no, dibuja el arma del inventario normal
        else if (code) {
            const item = database[slot].find(i => i.code === code);
            if (item && item.img) layersHtml += `<img src="${item.img}" class="char-layer" onerror="this.style.display='none';">`;
        }
    });
    document.getElementById('combat-char-box').innerHTML = layersHtml;
    document.getElementById('inv-char-box').innerHTML = layersHtml;
}

    function calculateStats() {
        stats.hpMax = 50; stats.def = 0; stats.atk = 0; stats.luck = 0;

        ['horns', 'hand', 'armor', 'leg'].forEach(slot => {
            const itemCode = gameState.equipped[slot];
            const slotElement = document.getElementById(`slot-${slot}`);
            if (itemCode) {
                const item = database[slot].find(i => i.code === itemCode);
                if (item) {
                    stats.hpMax += item.hp; 
                    stats.def += item.def; 
                    stats.atk += item.atk;
                    if (item.luck) stats.luck += item.luck;
                    document.getElementById(`slot-${slot}-name`).innerText = item.name;
                    if (item.img) slotElement.style.backgroundImage = `url('${item.img}')`;
                    else slotElement.style.backgroundImage = 'none';
                }
            } else {
                document.getElementById(`slot-${slot}-name`).innerText = "Ninguno";
                slotElement.style.backgroundImage = 'none';
            }
        });
        const utilCode = gameState.equipped.utility;
        if (gameState.activeBuff && gameState.activeBuff.turnsLeft > 0) {
            stats.atk += gameState.activeBuff.dmg;
            stats.def += gameState.activeBuff.def;
            stats.hpMax += gameState.activeBuff.hp;
            }
        }

        if (stats.hpMax <= 0) stats.hpMax = 10;
        if (gameState.hpCurrent > stats.hpMax) gameState.hpCurrent = stats.hpMax;

        ['skill1', 'skill2', 'skill3'].forEach(sSlot => {
            const sCode = gameState.equipped[sSlot];
            const slotElement = document.getElementById(`slot-${sSlot}`);
            const sItem = database.skills.find(s => s.code === sCode);
            if (sItem) {
                document.getElementById(`slot-${sSlot}-name`).innerText = sItem.name;
                if(sItem.img) { slotElement.style.backgroundImage = `url('${sItem.img}')`; slotElement.innerText = ""; }
                else { slotElement.style.backgroundImage = 'none'; slotElement.innerText = sSlot.replace('skill', ''); }
            } else {
                document.getElementById(`slot-${sSlot}-name`).innerText = "Vacío";
                slotElement.style.backgroundImage = 'none'; slotElement.innerText = sSlot.replace('skill', '');
            }
        });
        
        ['domain', 'habitat'].forEach(specSlot => {
            const code = gameState.equipped[specSlot];
            const elem = document.getElementById(`slot-${specSlot}`);
            const item = database[specSlot + 's'].find(i => i.code === code);
            if(item) {
                document.getElementById(`slot-${specSlot}-name`).innerText = item.name;
                if(item.img) { elem.style.backgroundImage = `url('${item.img}')`; elem.innerText = ""; }
                else { elem.style.backgroundImage = 'none'; elem.innerText = specSlot.slice(0,3).toUpperCase(); }
            } else {
                document.getElementById(`slot-${specSlot}-name`).innerText = "Vacío";
                elem.style.backgroundImage = 'none'; elem.innerText = specSlot.slice(0,3).toUpperCase();
            }
        });

        const utCode = gameState.equipped.utility;
        const utSlotElement = document.getElementById(`slot-utility`);
        const utItem = database.utility.find(u => u.code === utCode);
        if (utItem) {
            document.getElementById(`slot-utility-name`).innerText = utItem.name;
            if(utItem.img) utSlotElement.style.backgroundImage = `url('${utItem.img}')`;
            else utSlotElement.style.backgroundImage = 'none';
        } else {
            document.getElementById(`slot-utility-name`).innerText = "Ninguno";
            utSlotElement.style.backgroundImage = 'none';
        }
    

    // AÑADIDO: El parametro preserveSkills evita que las monedas se borren al atacar
    function updateUI(preserveSkills = false) {
        calculateStats();
        renderCharacterLayers();
        
        document.getElementById('inv-secret-section').style.display = gameState.specialUnlocked ? "flex" : "none";
        document.getElementById('combat-secret-section').style.display = gameState.specialUnlocked ? "flex" : "none";
        
        const hpPercent = (gameState.hpCurrent / stats.hpMax) * 100;
        document.getElementById('hp-fill').style.width = `${hpPercent}%`;
        document.getElementById('inv-hp-fill').style.width = `${hpPercent}%`;
        document.getElementById('current-hp').innerText = gameState.hpCurrent;
        document.getElementById('max-hp').innerText = stats.hpMax;

        document.getElementById('total-def').innerText = stats.def;
        document.getElementById('inv-total-def').innerText = stats.def;
        document.getElementById('total-atk').innerText = stats.atk;

        const utCode = gameState.equipped.utility;
        const utItem = database.utility.find(u => u.code === utCode);
        const combatUtilIcon = document.getElementById('combat-util-icon');
        if (utItem) {
            if(utItem.img) { combatUtilIcon.style.backgroundImage = `url('${utItem.img}')`; combatUtilIcon.innerText = ""; }
            else { combatUtilIcon.style.backgroundImage = 'none'; combatUtilIcon.innerText = utItem.name; }
            document.getElementById('util-uses-text').innerText = `${gameState.utilUsesLeft}/${utItem.uses}`;
        } else {
            combatUtilIcon.style.backgroundImage = 'none'; combatUtilIcon.innerText = "Utilidad";
            document.getElementById('util-uses-text').innerText = "0/0";
        }

        const buffInd = document.getElementById('active-buff-indicator');
        if (gameState.activeBuff && gameState.activeBuff.turnsLeft > 0) {
            buffInd.innerText = `[${gameState.activeBuff.name} ACTIVO: ${gameState.activeBuff.turnsLeft} Turnos]`;
        } else { buffInd.innerText = ""; }

        // Si estamos tirando monedas, NO re-dibujamos los pentagonos para no borrar las caras/cruces
        if (!preserveSkills) {
            renderCombatSkills();
        }
    }

    function restoreHP() {
    if (gameState.activeBuff) {
        gameState.hpCurrent = Math.max(0, gameState.hpCurrent - gameState.activeBuff.hp);
        gameState.activeBuff = null;
    }
    calculateStats();
    gameState.hpCurrent = stats.hpMax;
    const utItem = database.utility.find(u => u.code === gameState.equipped.utility);
    gameState.utilUsesLeft = utItem ? utItem.uses : 0;
    document.getElementById('dmg-dealt').innerText = "&";

    skillWeaponOverride = null; 
    
    // === [NUEVO] RESETEAR USOS DE DOMINIO/HÁBITAT Y QUITAR EL FONDO ===
    gameState.domainUsedThisCombat = false;
    gameState.habitatUsedThisCombat = false;
    const combatScreen = document.getElementById('combat-menu');
    combatScreen.style.backgroundImage = "none"; 
    combatScreen.style.background = "var(--bg-color)"; // Devuelve el fondo por defecto

    saveGame(); updateUI();
    }

    // ================= MECÁNICAS SECRETAS =================
    function activateDomain() {
    const code = gameState.equipped.domain;
    if (!code) return alert("No tienes ningún Dominio equipado.");
    if (gameState.domainUsedThisCombat) return alert("Ya has desplegado tu Dominio en este combate. ¡Solo se puede usar una vez!");
    if (gameState.activeBuff) return alert("Ya tienes un efecto activo en el combate.");

    const item = database.domains.find(d => d.code === code);
    gameState.activeBuff = { name: item.name, dmg: item.dmg, def: item.def, hp: item.hp, turnsLeft: item.turns };
    gameState.hpCurrent += item.hp;
    
    // Marcar como usado este combate
    gameState.domainUsedThisCombat = true;

    // === AQUÍ ESTÁ EL FONDO CORREGIDO ===
    const combatMenu = document.getElementById('combat-menu');
    if (item.img) {
        combatMenu.style.backgroundImage = `url('${item.img}')`;
        combatMenu.style.backgroundSize = "cover";
        combatMenu.style.backgroundPosition = "center";
    } else {
        combatMenu.style.background = "white";
    }

    alert(`¡DOMINIO DESPLEGADO: ${item.name}!\n\nObtienes +${item.dmg} DMG, +${item.def} DEF y +${item.hp} HP Max durante los próximos ${item.turns} turnos.`);
    saveGame(); updateUI();
    }

    function activateHabitat() {
    const code = gameState.equipped.habitat;
    if (!code) return alert("No tienes ningún Habitat Imperium equipado.");
    if (gameState.habitatUsedThisCombat) return alert("Ya has reclamado el Habitat en este combate. ¡Solo se puede usar una vez!");

    const item = database.habitats.find(h => h.code === code);
    
    gameState.hpCurrent = stats.hpMax;
    const utItem = database.utility.find(u => u.code === gameState.equipped.utility);
    gameState.utilUsesLeft = utItem ? utItem.uses : 0;
    
    gameState.activeBuff = { name: item.name, dmg: item.dmg, def: item.def, hp: item.hp, turnsLeft: item.turns };
    gameState.hpCurrent += item.hp; 
    
    gameState.habitatUsedThisCombat = true;

    // === AQUÍ ESTÁ EL FONDO CORREGIDO ===
    const combatMenu = document.getElementById('combat-menu');
    if (item.img) {
        combatMenu.style.backgroundImage = `url('${item.img}')`;
        combatMenu.style.backgroundSize = "cover";
        combatMenu.style.backgroundPosition = "center";
    } else {
        combatMenu.style.background = "white";
    }

    alert(`¡HABITAT IMPERIUM ACTIVADO: ${item.name}!\n\nTus recursos fueron restaurados.\nObtienes +${item.dmg} DMG, +${item.def} DEF y +${item.hp} HP Max durante ${item.turns} turnos.`);
    saveGame(); updateUI();
    }

    function applyDamage() {
        const y = parseInt(document.getElementById('dmg-input').value) || 0;
        let dmgTaken = Math.floor(y - (stats.def / 3));
        if (dmgTaken < 0) dmgTaken = 0;
        gameState.hpCurrent -= dmgTaken;
        if (gameState.hpCurrent < 0) gameState.hpCurrent = 0;
        saveGame(); updateUI();
    }

    function useUtility() {
        const utCode = gameState.equipped.utility;
        if (!utCode) return alert("No tienes utilidad equipada.");
        if (gameState.utilUsesLeft > 0) {
            const utItem = database.utility.find(u => u.code === utCode);
            gameState.utilUsesLeft--;
            if (utItem.type === "HP") gameState.hpCurrent = Math.min(stats.hpMax, gameState.hpCurrent + utItem.value);
            if (utItem.luck) {
                gameState.nextRollLuckBonus = utItem.luck;
                alert(`Te concentras con profundidad...\nTu próximo ataque tendrá +${utItem.luck}% extra de probabilidad de sacar caras.`);
            }
            saveGame(); updateUI();
        } else alert("Sin usos.");
    }

    function renderCombatSkills() {
        const container = document.getElementById('combat-skills-list');
        container.innerHTML = '';
        ['skill1', 'skill2', 'skill3'].forEach(sSlot => {
            const code = gameState.equipped[sSlot]; if (!code) return;
            const skill = database.skills.find(s => s.code === code); if (!skill) return;
            let coinsHtml = ''; for(let i=0; i<skill.coins; i++) { coinsHtml += `<div class="coin"></div>`; }
            const bgStyle = skill.img ? `background-image: url('${skill.img}'); color:transparent;` : '';
            
            // Renderizado base de los botones de ataque en combate (incluye la palabra Clash)
            container.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px;">
                    <div>
                        <div class="pentagon" style="${bgStyle}" onclick="useSkill('${skill.code}', '${sSlot}')">${skill.img ? '' : skill.name[0]}</div>
                        <div class="coins-container" id="coins-${sSlot}">${coinsHtml}</div>
                    </div>
                    <div style="font-size:12px; font-weight:bold;">Clash: <span id="clash-${sSlot}">0</span></div>
                </div>`;
        });
    }

    // AÑADIDO: Lógica de combate congelada para no resetear las visuales de la moneda
    function useSkill(code, slotId) {
    const skill = database.skills.find(s => s.code === code);
    
    // === MODIFICADO: Guardamos el sprite en la variable global si la skill tiene uno ===
    if (skill.weaponImg) {
        skillWeaponOverride = skill.weaponImg;
    }
    // Forzamos el redibujado con el nuevo aspecto
    renderCharacterLayers();

    const coinsDiv = document.getElementById(`coins-${slotId}`).children;
    let headsCount = 0; let clashTotal = skill.base;
    let damageTotal = stats.atk + skill.dmg;

    document.getElementById(`clash-${slotId}`).innerText = clashTotal;

    let activeLuck = gameState.nextRollLuckBonus || 0;
    let probCara = 0.5 + (stats.luck / 100) + (activeLuck / 100);
    if (probCara > 0.9) probCara = 0.9;

    for(let i=0; i<skill.coins; i++) {
        const coinUI = coinsDiv[i]; coinUI.classList.remove('flip-anim', 'tails');
        void coinUI.offsetWidth; coinUI.classList.add('flip-anim');
        const isHeads = Math.random() < probCara;
        
        setTimeout(() => {
            if (isHeads) { 
                coinUI.classList.remove('tails'); 
                headsCount++; 
                clashTotal += skill.coin; 
                damageTotal += skill.coinDmg; 
            } else { 
                coinUI.classList.add('tails'); 
            }
            
            document.getElementById(`clash-${slotId}`).innerText = clashTotal;

            if (i === skill.coins - 1) {
                if (headsCount === skill.coins) { damageTotal *= 2; alert("¡CARAS COMPLETAS! Daño x2"); }
                document.getElementById('dmg-dealt').innerText = damageTotal;
                
                // === ¡EL TIMEOUT DE 1500ms QUE ESTABA AQUÍ SE ELIMINÓ! ===
                // El arma ya no se restaurará sola al terminar el ataque.

                if (gameState.activeBuff && gameState.activeBuff.turnsLeft > 0) {
                    gameState.activeBuff.turnsLeft--;
                    if (gameState.activeBuff.turnsLeft <= 0) {
                        alert(`Los efectos de ${gameState.activeBuff.name} se han desvanecido.`);
                        gameState.hpCurrent = Math.min(gameState.hpCurrent, stats.hpMax - gameState.activeBuff.hp);
                        gameState.activeBuff = null;
                        const combatMenu = document.getElementById('combat-menu');
                        combatMenu.style.backgroundImage = "none";
                        combatMenu.style.background = "var(--bg-color)";
                    }
                }
                saveGame(); 
                updateUI(true); 
            }
        }, 250);
    }
    gameState.nextRollLuckBonus = 0;
}

    function openEquipModal(slotType) {
        activeSlotType = slotType;
        const modal = document.getElementById('equip-modal');
        const container = document.getElementById('modal-items-list');
        container.innerHTML = '';
        
        let dbCategory = slotType;
        if (slotType.startsWith('skill')) dbCategory = 'skills';
        else if (slotType === 'domain') dbCategory = 'domains';
        else if (slotType === 'habitat') dbCategory = 'habitats';

        document.getElementById('modal-title').innerText = `Equipar en: ${slotType.toUpperCase()}`;
        const unlockedCodes = gameState.unlocked[dbCategory] || [];
        if(unlockedCodes.length === 0) container.innerHTML = '<div style="color:white; font-weight:bold;">Sin objetos disponibles.</div>';
        
        unlockedCodes.forEach(code => {
            const item = database[dbCategory].find(i => i.code === code);
            if (!item) return;
            let statsHtml = '';
            
           if (['horns', 'hand', 'armor', 'leg'].includes(dbCategory)) {
                statsHtml = `<strong>HP:</strong> ${item.hp>=0?'+':''}${item.hp || 0}<br><strong>DEF:</strong> ${item.def>=0?'+':''}${item.def || 0}<br><strong>ATK:</strong> ${item.atk>=0?'+':''}${item.atk || 0}`;
                if (item.luck) statsHtml += `<br><span style="color:#d4af37;"><strong>LUCK:</strong> +${item.luck}%</span>`;
            } else if (dbCategory === 'skills') {
                statsHtml = `<strong>Monedas:</strong> ${item.coins}<br><strong>Base:</strong> ${item.base}<br><strong>Coin:</strong> +${item.coin}<br><strong>Dmg:</strong> ${item.dmg}<br><strong>Coin Dmg:</strong> +${item.coinDmg}`;
            } else if (dbCategory === 'utility') {
                statsHtml = `<strong>Efecto:</strong> ${item.type} +${item.value}<br><strong>Usos:</strong> ${item.uses}`;
                if (item.luck) statsHtml += `<br><span style="color:#d4af37;"><strong>LUCK:</strong> +${item.luck}%</span>`;
            } else if (dbCategory === 'domains' || dbCategory === 'habitats') {
                statsHtml = `<span style="color:purple;"><strong>Turnos:</strong> ${item.turns}</span><br><strong>DMG:</strong> +${item.dmg}<br><strong>DEF:</strong> +${item.def}<br><strong>HP:</strong> +${item.hp}`;
            }

            container.innerHTML += `
            <div style="background: white; border:2px solid black; padding:10px; width:145px; font-weight:bold; font-size:11px; color: black; box-shadow: 3px 3px 0px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 5px;">
                <div style="border-bottom: 2px solid black; padding-bottom:3px; margin-bottom:5px;">${item.name}</div>
                <div style="color:#444; line-height:1.3; font-weight:normal;">${statsHtml}</div>
                <div style="display: flex; gap: 5px; margin-top: auto; padding-top: 5px;">
                    <button onclick="equipItem('${item.code}')" style="flex: 1; font-size: 10px; font-weight: bold; cursor: pointer; padding: 4px; border: 1px solid black; background: #e0e0e0; border-radius: 3px;">EQUIPAR</button>
                    <button onclick="showItemDesc('${dbCategory}', '${item.code}')" style="width: 25px; font-size: 12px; cursor: pointer; border: 1px solid black; background: #fff; border-radius: 3px;" title="Ver descripción">📋</button>
                </div>
            </div>`;
        });
        modal.style.display = 'block';
    }

    function equipItem(code) {
        gameState.equipped[activeSlotType] = code;
        if(activeSlotType === 'utility') {
            const utItem = database.utility.find(u => u.code === code);
            gameState.utilUsesLeft = utItem ? utItem.uses : 0;
        }
        document.getElementById('equip-modal').style.display = 'none';
        saveGame(); updateUI();
    }
    function closeEquipModal() { document.getElementById('equip-modal').style.display = 'none'; }

    function decodeItem() {
        const input = document.getElementById('decode-input').value.toUpperCase().trim();
        const indicator = document.getElementById('decode-indicator');
        document.getElementById('decode-input').value = '';
        
        if (input === "ARHJOE!23D") {
            gameState.specialUnlocked = true;
            if (!gameState.unlocked.domains.includes("DOM-01")) gameState.unlocked.domains.push("DOM-01");
            if (!gameState.unlocked.habitats.includes("HAB-01")) gameState.unlocked.habitats.push("HAB-01");
            indicator.style.background = '#9370DB';
            alert("¡SISTEMA CLASIFICADO DESBLOQUEADO!\n\nLas interfaces de Dominios y Habitat Imperium ahora están disponibles en el sistema.");
            saveGame(); updateUI();
            setTimeout(() => { indicator.style.background = 'gray'; }, 3000);
            return;
        }

        let foundCategory = null;
        Object.keys(database).forEach(cat => {
            if (database[cat].some(i => i.code === input) && !gameState.unlocked[cat].includes(input)) foundCategory = cat;
        });
        if (foundCategory) {
            gameState.unlocked[foundCategory].push(input); indicator.style.background = 'green';
            alert(`¡DESBLOQUEADO!: ${input}`); saveGame(); updateUI();
        } else { indicator.style.background = 'red'; alert("Código inválido o ya registrado."); }
        setTimeout(() => { indicator.style.background = 'gray'; }, 3000);
    }
    function rollD20() {
    const dice = document.getElementById('d20-dice');
    const resultText = document.getElementById('d20-result');
    
    // Animación rápida de golpe
    dice.style.transform = "scale(0.8)";
    setTimeout(() => dice.style.transform = "scale(1)", 100);
    
    // Generar número entre 1 y 20
    const roll = Math.floor(Math.random() * 20) + 1;
    resultText.innerText = roll;
    
    // Color especial si es crítico (1 o 20)
    if (roll === 20) resultText.style.color = "#00ff00";
    else if (roll === 1) resultText.style.color = "#ff0000";
    else resultText.style.color = "#ffd700";
    }

    function showItemDesc(category, code) {
        const item = database[category].find(i => i.code === code);
        if (item && item.desc) {
        alert(`📖 ${item.name}\n\n${item.desc}`);
        } else {
        alert(`📖 ${item.name}\n\nEste objeto aún no tiene una descripción clasificada en la base de datos.`);
    }
}
    loadGame();
    updateUI();
</script>
</body>
